<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAIKA PRINT STORE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-body">

  <div class="falling-lines">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>

  <div class="landing-card">
    <div class="main-logo-container">
      <img src="logo.png" alt="MAIKA PRINT STORE" class="portal-logo pulse-logo" onerror="this.onerror=null; this.src='logo.jpg';">
    </div>

    <h1 class="glowing-title">MAIKA PRINT STORE</h1>
    <p class="subtitle">Made By Eng / Mohamed Fekry</p>

    <div class="tags" id="portalTags"></div>

    <a href="store.html" class="enter-btn">دخول المتجر</a>
    <button onclick="openAdminModal()" class="admin-btn">دخول الأدمن</button>
  </div>

  <div id="adminModal" class="modal">
    <div class="modal-content">
      <h3>تسجيل دخول الأدمن</h3>
      <input type="password" id="adminPassInput" placeholder="أدخل كلمة السر">
      <p id="errorMsg" class="error-msg"></p>
      <button onclick="submitAdminPass()" class="save-btn">دخول</button>
      <button onclick="closeAdminModal()" class="back-btn">إلغاء</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    renderPortalTags();
  </script>
</body>
</html>
