<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAIKA PRINT - المتجر</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="store-body">

  <header class="navbar">
    <div class="brand">
      <img src="logo.png" alt="Logo" class="nav-logo pulse-logo" onerror="this.src='logo.jpg'">
      <span class="glowing-title">MAIKA PRINT</span>
    </div>
    <div class="developer-tag">Made By Eng / Mohamed Fekry</div>
    <div class="search-box">
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="إبحث عن خدمة هنا...">
    </div>
    <nav class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="#gallerySection">معرض الأعمال</a>
      <a href="#reviewsSection">آراء العملاء</a>
      <button onclick="toggleTheme()" class="action-btn" style="padding: 6px 12px; font-size: 12px;">
        ☀️ / 🌙 المظهر
      </button>
      <button class="cart-btn-nav" onclick="toggleCartModal()">
        🛒 السلة (<span id="cartCount">0</span>)
      </button>
    </nav>
  </header>

  <section class="hero-section">
    <div class="hero-logo-box">
      <img src="logo.png" alt="Logo" class="hero-logo pulse-logo" onerror="this.src='logo.jpg'">
    </div>
    <h1>مرحباً بك في عالم الطباعة الرقمية</h1>
    <p>اختر الكمية وأضف المنتجات للسلة واطلب كل احتياجاتك دفعة واحدة عبر الواتساب</p>
  </section>

  <main class="store-container">
    <div class="categories-tabs-wrapper">
      <div id="categoriesTabs" class="categories-tabs"></div>
    </div>

    <div id="productsDisplayArea" class="products-grid"></div>

    <section id="gallerySection" style="margin-top: 60px; padding: 0 40px;">
      <h2 style="text-align: center; color: #d4a373; border-bottom: 1px solid #3d2822; padding-bottom: 10px; margin-bottom: 25px;">
        📸 معرض الأعمال المطبوعة
      </h2>
      <div id="galleryGrid" class="products-grid"></div>
    </section>

    <section id="reviewsSection" style="margin-top: 60px; padding: 0 40px 60px;">
      <h2 style="text-align: center; color: #d4a373; border-bottom: 1px solid #3d2822; padding-bottom: 10px; margin-bottom: 25px;">
        ⭐ آراء وتقييمات العملاء
      </h2>
      
      <div id="reviewsList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-bottom: 30px;"></div>

      <div class="dash-card" style="max-width: 500px; margin: 0 auto;">
        <h3 style="margin-top: 0; color: #e2d1c3;">أضف رأيك في خدماتنا</h3>
        <form onsubmit="saveCustomerReview(event)">
          <div class="form-group" style="margin-bottom: 10px;">
            <input type="text" id="revClientName" placeholder="إسمك" required>
          </div>
          <div class="form-group" style="margin-bottom: 10px;">
            <select id="revStars" required>
              <option value="5">⭐⭐⭐⭐⭐ (5/5 ممتاز)</option>
              <option value="4">⭐⭐⭐⭐ (4/5 جيد جداً)</option>
              <option value="3">⭐⭐⭐ (3/5 جيد)</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom: 10px;">
            <input type="text" id="revComment" placeholder="اكتب تعليقك هنا..." required>
          </div>
          <button type="submit" class="action-btn" style="width: 100%;">إرسال التقييم</button>
        </form>
      </div>
    </section>
  </main>

  <div id="cartModal" class="modal">
    <div class="modal-content cart-modal-content">
      <h3>🛒 سلة المشتريات</h3>
      <div id="cartItemsList" class="cart-items-list"></div>

      <div style="display: flex; gap: 8px; margin-bottom: 15px;">
        <input type="text" id="promoCodeInput" placeholder="كود الخصم (مثل MAIKA10)" style="margin: 0; padding: 6px; font-size: 12px;">
        <button onclick="applyPromoCode()" class="action-btn" style="padding: 6px 12px; font-size: 12px; white-space: nowrap;">تطبيق</button>
      </div>
      
      <div class="cart-summary">
        <strong>الإجمالي: <span id="cartTotalPrice">0</span> EGP</strong>
      </div>

      <button onclick="sendCartToWhatsApp()" class="buy-whatsapp-btn" style="margin-top: 15px;">
        إرسال الطلب بالكامل عبر الواتساب
      </button>
      <button onclick="toggleCartModal()" class="back-btn">إغلاق</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    displayStoreTabs();
    updateCartUI();
    renderGallery();
    renderReviews();
  </script>
</body>
</html>
